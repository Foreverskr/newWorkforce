services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workforce-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://workforce.tripwisetnvs.tech/api
    container_name: workforce-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped